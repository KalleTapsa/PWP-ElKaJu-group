openapi: 3.0.0
info:
  title: PeculiarPlaces API
  description: API for discovering, sharing, and reviewing peculiar or interesting places.
  version: 1.0.0
servers:
  - url: /api
    description: Local development server

security: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key obtained from POST /api/users/

  schemas:
    PlaceInput:
      type: object
      properties:
        name:
          type: string
          example: "Mysterious Cave"
        description:
          type: string
          example: "A hidden cave with unusual rock formations"
        category:
          type: string
          example: "nature"
        address:
          type: string
          example: "Forest Road 1"
        postal_code:
          type: string
          example: "00100"
        city:
          type: string
          example: "Helsinki"
        latitude:
          type: number
          format: float
          example: 60.1699
        longitude:
          type: number
          format: float
          example: 24.9384
        application:
          type: string
          example: "MyApp"
      required:
        - name
        - latitude
        - longitude

    PlaceSummary:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Mysterious Cave"
        latitude:
          type: number
          format: float
          example: 60.1699
        longitude:
          type: number
          format: float
          example: 24.9384
        category:
          type: string
          example: "nature"
        trust_score:
          type: number
          format: float
          example: 4.0

    Place:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Mysterious Cave"
        description:
          type: string
          example: "A hidden cave with unusual rock formations"
        category:
          type: string
          example: "nature"
        address:
          type: string
          example: "Forest Road 1"
        postal_code:
          type: string
          example: "00100"
        city:
          type: string
          example: "Helsinki"
        latitude:
          type: number
          format: float
          example: 60.1699
        longitude:
          type: number
          format: float
          example: 24.9384
        application:
          type: string
          example: "MyApp"
        trust_score:
          type: number
          format: float
          example: 4.0

    ReviewInput:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        text:
          type: string
          example: "Absolutely breathtaking!"
      required:
        - rating

    Review:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 2
        place_id:
          type: integer
          example: 1
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        text:
          type: string
          example: "Absolutely breathtaking!"
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T12:00:00Z"
        trust_score:
          type: number
          format: float
          example: 4.0

    Image:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 2
        place_id:
          type: integer
          example: 1
        description:
          type: string
          example: "Entrance to the cave"
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T12:00:00Z"
        trust_score:
          type: number
          format: float
          example: 4.0
        image_url:
          type: string
          example: "/api/uploads/3f2e1a-photo.jpg"

    ReportInput:
      type: object
      properties:
        report_type:
          type: integer
          enum: [1, 2, 3]
          description: "1=INCORRECT, 2=INAPPROPRIATE, 3=APPROPRIATE"
          example: 3
      required:
        - report_type

    ReportPlace:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 2
        place_id:
          type: integer
          example: 1
        report_type:
          type: integer
          enum: [1, 2, 3]
          description: "1=INCORRECT, 2=INAPPROPRIATE, 3=APPROPRIATE"
          example: 3
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T12:00:00Z"

    ReportReview:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 3
        review_id:
          type: integer
          example: 1
        report_type:
          type: integer
          enum: [1, 2, 3]
          description: "1=INCORRECT, 2=INAPPROPRIATE, 3=APPROPRIATE"
          example: 2
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T13:00:00Z"

    ReportImage:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 3
        image_id:
          type: integer
          example: 1
        report_type:
          type: integer
          enum: [1, 2, 3]
          description: "1=INCORRECT, 2=INAPPROPRIATE, 3=APPROPRIATE"
          example: 2
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T14:00:00Z"

paths:

  # ── Users ──────────────────────────────────────────────────────────────────

  /users/:
    post:
      summary: Register a new user
      description: Creates a new user and returns a one-time API key.
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              example:
                id: 1
                api_key: "abc123secretkey"
                message: "User created successfully. Save your API key, it will not be shown again."

  /users/{user_id}/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          example: 1
    delete:
      summary: Delete own user account
      description: Deletes the authenticated user's account and all associated data (places, reviews, images, reports).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              example:
                message: "User and all associated data deleted successfully"
        '401':
          description: Authentication required
          content:
            application/json:
              example:
                error: "Authentication required"
        '403':
          description: Cannot delete another user's account
          content:
            application/json:
              example:
                error: "You can only delete your own user"
        '404':
          description: User not found
          content:
            application/json:
              example:
                error: "User not found"

  /users/{user_id}/places/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          example: 1
    get:
      summary: Get all places by a user
      responses:
        '200':
          description: List of places created by the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceSummary'
              example:
                - id: 1
                  name: "Mysterious Cave"
                  latitude: 60.1699
                  longitude: 24.9384
                  category: "nature"
                  trust_score: 4.0

  /users/{user_id}/reviews/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          example: 1
    get:
      summary: Get all reviews by a user
      responses:
        '200':
          description: List of reviews created by the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
              example:
                - id: 1
                  user_id: 1
                  place_id: 2
                  rating: 4
                  text: "Really cool spot!"
                  timestamp: "2024-01-15T12:00:00Z"
                  trust_score: 4.0

  /users/{user_id}/images/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          example: 1
    get:
      summary: Get all images uploaded by a user
      responses:
        '200':
          description: List of images uploaded by the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Image'
              example:
                - id: 1
                  user_id: 1
                  place_id: 2
                  description: "Entrance to the cave"
                  timestamp: "2024-01-15T12:00:00Z"
                  trust_score: 4.0
                  image_url: "/api/uploads/3f2e1a-photo.jpg"

  /users/{user_id}/reports/places/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          example: 1
    get:
      summary: Get all place reports by a user (own reports only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of place reports filed by the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportPlace'
              example:
                - id: 1
                  user_id: 1
                  place_id: 2
                  report_type: 3
                  timestamp: "2024-01-15T12:00:00Z"
        '401':
          description: Authentication required
          content:
            application/json:
              example:
                error: "Authentication required"
        '404':
          description: Access denied (shown as not found)
          content:
            application/json:
              example:
                description: "Not found"

  /users/{user_id}/reports/reviews/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          example: 1
    get:
      summary: Get all review reports by a user (own reports only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of review reports filed by the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportReview'
              example:
                - id: 1
                  user_id: 1
                  review_id: 3
                  report_type: 2
                  timestamp: "2024-01-15T13:00:00Z"
        '401':
          description: Authentication required
          content:
            application/json:
              example:
                error: "Authentication required"
        '404':
          description: Access denied (shown as not found)
          content:
            application/json:
              example:
                description: "Not found"

  /users/{user_id}/reports/images/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          example: 1
    get:
      summary: Get all image reports by a user (own reports only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of image reports filed by the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportImage'
              example:
                - id: 1
                  user_id: 1
                  image_id: 3
                  report_type: 2
                  timestamp: "2024-01-15T14:00:00Z"
        '401':
          description: Authentication required
          content:
            application/json:
              example:
                error: "Authentication required"
        '404':
          description: Access denied (shown as not found)
          content:
            application/json:
              example:
                description: "Not found"

  # ── Places ─────────────────────────────────────────────────────────────────

  /places/:
    get:
      summary: Get all places
      description: Returns a list of places. Supports filtering by trust score, location radius, category, or application.
      parameters:
        - name: trust_score
          in: query
          description: Minimum trust score filter (default 0)
          schema:
            type: number
            format: float
            default: 0
            example: 3.5
        - name: latitude
          in: query
          description: Center latitude for radius search
          schema:
            type: number
            format: float
            example: 60.1699
        - name: longitude
          in: query
          description: Center longitude for radius search
          schema:
            type: number
            format: float
            example: 24.9384
        - name: radius
          in: query
          description: Search radius in kilometres (used with latitude and longitude)
          schema:
            type: number
            format: float
            example: 10.0
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
            example: "nature"
        - name: application
          in: query
          description: Filter by application name
          schema:
            type: string
            example: "MyApp"
      responses:
        '200':
          description: List of places
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceSummary'
              example:
                - id: 1
                  name: "Mysterious Cave"
                  latitude: 60.1699
                  longitude: 24.9384
                  category: "nature"
                  trust_score: 4.0
                - id: 2
                  name: "Abandoned Factory"
                  latitude: 60.2052
                  longitude: 24.6559
                  category: "urban"
                  trust_score: 3.6

    post:
      summary: Create a new place
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceInput'
            example:
              name: "Mysterious Cave"
              description: "A hidden cave with unusual rock formations"
              category: "nature"
              address: "Forest Road 1"
              postal_code: "00100"
              city: "Helsinki"
              latitude: 60.1699
              longitude: 24.9384
              application: "MyApp"
      responses:
        '201':
          description: Place created successfully
          headers:
            Location:
              description: URL of the newly created place
              schema:
                type: string
                example: "/api/places/1/"
          content:
            application/json:
              example:
                id: 1
                message: "Place created successfully"
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              example:
                error: "Missing required fields: ['name']"
        '401':
          description: Authentication required
          content:
            application/json:
              example:
                error: "Authentication required"
        '415':
          description: Content type must be application/json
          content:
            application/json:
              example:
                error: "Request content type must be JSON"

  /places/{place_id}/:
    parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: integer
          example: 1

    get:
      summary: Get a single place
      responses:
        '200':
          description: Place details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
              example:
                id: 1
                user_id: 1
                name: "Mysterious Cave"
                description: "A hidden cave with unusual rock formations"
                category: "nature"
                address: "Forest Road 1"
                postal_code: "00100"
                city: "Helsinki"
                latitude: 60.1699
                longitude: 24.9384
                application: "MyApp"
                trust_score: 4.0
        '404':
          description: Place not found
          content:
            application/json:
              example:
                description: "Place not found"

    put:
      summary: Update a place (owner only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceInput'
            example:
              description: "Updated description"
              city: "Espoo"
      responses:
        '200':
          description: Place updated successfully
          content:
            application/json:
              example:
                message: "Place updated successfully"
        '400':
          description: Invalid field values
          content:
            application/json:
              example:
                error: "Invalid field values"
        '401':
          description: Authentication required
          content:
            application/json:
              example:
                error: "Authentication required"
        '403':
          description: Not the owner of this place
          content:
            application/json:
              example:
                error: "You do not own this resource"
        '404':
          description: Place not found
          content:
            application/json:
              example:
                description: "Place not found"
        '415':
          description: Content type must be application/json
          content:
            application/json:
              example:
                error: "Request content type must be JSON"

    delete:
      summary: Delete a place (owner only)
      description: Deletes the place and all associated reviews, images, and reports.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Place deleted successfully
        '401':
          description: Authentication required
          content:
            application/json:
              example:
                error: "Authentication required"
        '403':
          description: Not the owner of this place
          content:
            application/json:
              example:
                error: "You do not own this resource"
        '404':
          description: Place not found
          content:
            application/json:
              example:
                description: "Place not found"

  # ── Reviews ────────────────────────────────────────────────────────────────

  /places/{place_id}/reviews/:
    parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: integer
          example: 1

    get:
      summary: Get all reviews for a place
      responses:
        '200':
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
              example:
                - id: 1
                  user_id: 2
                  place_id: 1
                  rating: 5
                  text: "Absolutely breathtaking!"
                  timestamp: "2024-01-15T12:00:00Z"
                  trust_score: 4.0

    post:
      summary: Create a review for a place
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
            example:
              rating: 5
              text: "Absolutely breathtaking!"
      responses:
        '201':
          description: Review created successfully
          content:
            application/json:
              example:
                id: 1
                message: "Review created successfully"
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              example:
                error: "Missing required fields: ['rating']"
        '401':
          description: Authentication required
          content:
            application/json:
              example:
                error: "Authentication required"
        '404':
          description: Place not found
          content:
            application/json:
              example:
                description: "Place not found"
        '415':
          description: Content type must be application/json
          content:
            application/json:
              example:
                error: "Request content type must be JSON"

  /places/{place_id}/reviews/{review_id}/:
    parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: integer
          example: 1
      - name: review_id
        in: path
        required: true
        schema:
          type: integer
          example: 1

    get:
      summary: Get a single review
      responses:
        '200':
          description: Review details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
              example:
                id: 1
                user_id: 2
                place_id: 1
                rating: 5
                text: "Absolutely breathtaking!"
                timestamp: "2024-01-15T12:00:00Z"
                trust_score: 4.0
        '404':
          description: Review not found or does not belong to this place
          content:
            application/json:
              example:
                description: "Review not found"

    delete:
      summary: Delete a review (owner only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Review deleted successfully
          content:
            application/json:
              example:
                message: "Review deleted successfully"
        '401':
          description: Authentication required
          content:
            application/json:
              example:
                error: "Authentication required"
        '403':
          description: Not the owner of this review
          content:
            application/json:
              example:
                error: "You do not own this resource"
        '404':
          description: Review not found or does not belong to this place
          content:
            application/json:
              example:
                description: "Review not found"

  # ── Images ─────────────────────────────────────────────────────────────────

  /places/{place_id}/images/:
    parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: integer
          example: 1

    get:
      summary: Get all images for a place
      description: Results are cached per place.
      responses:
        '200':
          description: List of images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Image'
              example:
                - id: 1
                  user_id: 2
                  place_id: 1
                  description: "Entrance to the cave"
                  timestamp: "2024-01-15T12:00:00Z"
                  trust_score: 4.0
                  image_url: "/api/uploads/3f2e1a-photo.jpg"

    post:
      summary: Upload an image for a place
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (jpg, jpeg, or png only)
                description:
                  type: string
                  example: "Entrance to the cave"
              required:
                - file
      responses:
        '201':
          description: Image uploaded successfully
          content:
            application/json:
              example:
                id: 1
                message: "Image uploaded successfully"
        '400':
          description: No file provided or unsupported file type
          content:
            application/json:
              examples:
                no_file:
                  value:
                    error: "No file provided"
                bad_type:
                  value:
                    error: "File type not allowed. Only jpg, jpeg, and png allowed"
        '401':
          description: Authentication required
          content:
            application/json:
              example:
                error: "Authentication required"
        '404':
          description: Place not found
          content:
            application/json:
              example:
                description: "Place not found"

  /places/{place_id}/images/{image_id}/:
    parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: integer
          example: 1
      - name: image_id
        in: path
        required: true
        schema:
          type: integer
          example: 1

    get:
      summary: Get a single image
      responses:
        '200':
          description: Image details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
              example:
                id: 1
                user_id: 2
                place_id: 1
                description: "Entrance to the cave"
                timestamp: "2024-01-15T12:00:00Z"
                trust_score: 4.0
                image_url: "/api/uploads/3f2e1a-photo.jpg"
        '404':
          description: Image not found or does not belong to this place
          content:
            application/json:
              example:
                description: "Image not found"

    delete:
      summary: Delete an image (owner only)
      description: Deletes the image record and the file from storage.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Image deleted successfully
          content:
            application/json:
              example:
                message: "Image deleted successfully"
        '401':
          description: Authentication required
          content:
            application/json:
              example:
                error: "Authentication required"
        '403':
          description: Not the owner of this image
          content:
            application/json:
              example:
                error: "You do not own this resource"
        '404':
          description: Image not found
          content:
            application/json:
              example:
                description: "Image not found"

  /uploads/{filename}:
    parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
          example: "3f2e1a-photo.jpg"
    get:
      summary: Serve an uploaded image file
      responses:
        '200':
          description: Image file content
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: File not found

  # ── Place Reports ───────────────────────────────────────────────────────────

  /places/{place_id}/reports/:
    parameters:
      - name: place_id
        in: path
        required: true
        schema:
          type: integer
          example: 1

    get:
      summary: Get all reports for a place
      responses:
        '200':
          description: List of place reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportPlace'
              example:
                - id: 1
                  user_id: 2
                  place_id: 1
